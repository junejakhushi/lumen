[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lumen_pipeline"
version = "0.1.0"
description = "Lumen asset pipeline: sliced CAD STL -> exact volume -> reconstructed 3D mesh"
requires-python = ">=3.11"
dependencies = [
  "trimesh>=4.4",
  "numpy>=1.26",
  "scipy>=1.11",
  "shapely>=2.0",
  "scikit-image>=0.22",
  "networkx>=3.2",
  "rtree>=1.2",
  "fast-simplification>=0.1.7",
  "pygltflib>=1.16",
  "click>=8.1",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8", "manifold3d>=2.5"]  # manifold3d: boolean ops used by the test fixtures

[project.scripts]
lumen = "lumen_pipeline.cli:main"

[tool.setuptools]
packages = ["lumen_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
