<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>BottomSheet — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@400;500&family=Tiro+Devanagari+Hindi&display=swap">
</head>
<body>
<div id="root"></div>
<script>
var Q = window.QuietHeritage, h = React.createElement;
function cell(cap, el, style) { return h("div", { className: "qh-demo__cell", style: style }, el, h("span", { className: "qh-demo__cap" }, cap)); }
function row(title, kids) { return h("div", { className: "qh-demo__row" }, title ? h("p", { className: "qh-demo__h" }, title) : null, kids); }
function evening(kids, style) { return h("div", { "data-theme": "evening", className: "qh-evening-panel", style: Object.assign({ padding: 24 }, style || {}) }, kids); }
var STATES = ["default", "hover", "pressed", "focus", "disabled"];

function App() {
  return h("div", { className: "qh-demo" },
    h("div", { style: { position: "relative", width: 390, height: 560, border: "1px solid var(--hairline-quiet)", overflow: "hidden", background: "var(--surface-alt)" } },
      h(Q.BottomSheet, { inline: true, title: "Peacock jhumka", onClose: function () {}, footer: [h(Q.Button, { key: "a", variant: "secondary" }, "Try it on"), h(Q.Button, { key: "b" }, "Book")] },
        h("div", { style: { display: "flex", flexDirection: "column", gap: 20 } }, h(Q.PricePill, { low: "1.4", high: "1.7" }), h(Q.SpecTable, { rows: [{ label: "Code", value: "LM-JH-0214" }, { label: "Metal", value: "Yellow gold" }, { label: "Karat", value: "22K" }, { label: "Weight", value: "14.2 g" }] })))),
    h("div", { "data-theme": "evening", style: { position: "relative", width: 390, height: 560, overflow: "hidden", background: "#2a2622" } },
      h(Q.BottomSheet, { inline: true, title: "Snapshot saved", onClose: function () {}, footer: [h(Q.Button, { key: "b", block: true }, "Book a consultation")] },
        h("p", { style: { margin: 0, color: "var(--text-muted)" } }, "Your look is saved. Bring it to your consultation and the atelier will start from here."))));
}
ReactDOM.createRoot(document.getElementById("root")).render(App());
</script>
</body>
</html>
