<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>SegmentedControl — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@400;500&family=Tiro+Devanagari+Hindi&display=swap">
</head>
<body>
<div id="root"></div>
<script>
var Q = window.QuietHeritage, h = React.createElement;
function cell(cap, el, style) { return h("div", { className: "qh-demo__cell", style: style }, el, h("span", { className: "qh-demo__cap" }, cap)); }
function row(title, kids) { return h("div", { className: "qh-demo__row" }, title ? h("p", { className: "qh-demo__h" }, title) : null, kids); }
function evening(kids, style) { return h("div", { "data-theme": "evening", className: "qh-evening-panel", style: Object.assign({ padding: 24 }, style || {}) }, kids); }
var STATES = ["default", "hover", "pressed", "focus", "disabled"];

function App() {
  var metals = [{ value: "yellow", label: "Yellow", swatch: "var(--metal-yellow)" }, { value: "white", label: "White", swatch: "var(--metal-white)" }, { value: "rose", label: "Rose", swatch: "var(--metal-rose)" }];
  return h("div", { className: "qh-demo qh-demo--col" },
    h("div", { className: "qh-demo__row" },
      h(Q.SegmentedControl, { label: "Metal", options: metals, defaultValue: "yellow" }),
      h(Q.SegmentedControl, { label: "Karat", options: [{ value: "14", label: "14K" }, { value: "18", label: "18K" }, { value: "22", label: "22K" }], defaultValue: "18" })),
    row("Option states", [
      cell("hover · pressed · focus", h(Q.SegmentedControl, { "aria-label": "Karat states", options: [{ value: "14", label: "14K" }, { value: "18", label: "18K" }, { value: "22", label: "22K" }], defaultValue: "18", states: { "14": "hover", "22": "focus" } }), { key: "a" }),
      cell("pressed", h(Q.SegmentedControl, { "aria-label": "Karat pressed", options: [{ value: "14", label: "14K" }, { value: "18", label: "18K" }, { value: "22", label: "22K" }], defaultValue: "18", states: { "22": "pressed" } }), { key: "b" }),
      cell("22K unavailable in rose", h(Q.SegmentedControl, { "aria-label": "Karat disabled", options: [{ value: "14", label: "14K" }, { value: "18", label: "18K" }, { value: "22", label: "22K", disabled: true }], defaultValue: "18" }), { key: "c" })]));
}
ReactDOM.createRoot(document.getElementById("root")).render(App());
</script>
</body>
</html>
