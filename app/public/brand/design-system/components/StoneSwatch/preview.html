<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>StoneSwatch — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@400;500&family=Tiro+Devanagari+Hindi&display=swap">
</head>
<body>
<div id="root"></div>
<script>
var Q = window.QuietHeritage, h = React.createElement;
function cell(cap, el, style) { return h("div", { className: "qh-demo__cell", style: style }, el, h("span", { className: "qh-demo__cap" }, cap)); }
function row(title, kids) { return h("div", { className: "qh-demo__row" }, title ? h("p", { className: "qh-demo__h" }, title) : null, kids); }
function evening(kids, style) { return h("div", { "data-theme": "evening", className: "qh-evening-panel", style: Object.assign({ padding: 24 }, style || {}) }, kids); }
var STATES = ["default", "hover", "pressed", "focus", "disabled"];

function App() {
  return h("div", { className: "qh-demo qh-demo--col" },
    h(Q.SwatchGroup, { kind: "stone", label: "Stone", defaultValue: "ruby", showLabels: true }),
    row("States", [
      cell("default", h(Q.StoneSwatch, { stone: "emerald" }), { key: 1 }),
      cell("hover", h(Q.StoneSwatch, { stone: "emerald", state: "hover" }), { key: 2 }),
      cell("pressed", h(Q.StoneSwatch, { stone: "emerald", state: "pressed" }), { key: 3 }),
      cell("selected", h(Q.StoneSwatch, { stone: "emerald", selected: true }), { key: 4 }),
      cell("focus", h(Q.StoneSwatch, { stone: "emerald", state: "focus" }), { key: 5 }),
      cell("disabled", h(Q.StoneSwatch, { stone: "emerald", disabled: true }), { key: 6 })]),
    evening(h(Q.SwatchGroup, { kind: "stone", label: "Stone · evening", defaultValue: "pearl", unavailable: ["sapphire"] })));
}
ReactDOM.createRoot(document.getElementById("root")).render(App());
</script>
</body>
</html>
