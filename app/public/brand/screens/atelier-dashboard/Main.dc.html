<html lang="en">
<head>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&amp;family=Jost:wght@300;400;500&amp;family=Tiro+Devanagari+Hindi&amp;display=swap">
<style>
body{margin:0;background:#F5F0E8;color:#1B1916;font-family:Jost,Futura,sans-serif}
a{color:#1B1916}a:hover{color:#6E1E2A}
.sc{font-family:"Cormorant Garamond",Georgia,serif;font-variant-caps:all-small-caps;font-weight:600;letter-spacing:.16em;color:#655E54}
.disp{font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;margin:0}
.num{font-variant-numeric:tabular-nums}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; position: relative; overflow: hidden; background: #F5F0E8; color: #1B1916; font-family: Jost, Futura, sans-serif; ">
<div style="display: flex; height: 100%; align-items: center; justify-content: center;">
<form style="width: 400px; display: flex; flex-direction: column; gap: 20px; align-items: center; text-align: center;">
<x-import component-from-global-scope="QuietHeritage.LumenMonogram" size="{{n48}}"></x-import>
<p class="sc" style="margin: 0; font-size: 16px; color: #1B1916;">The Atelier · Studio</p>
<h1 class="disp" style="font-size: 40px; line-height: 44px;">The studio dashboard</h1>
<p style="margin: 0; font-size: 15px; line-height: 22px; color: #655E54;">Enter the studio passcode. It keeps consultations, briefs and client details on this device for eight hours.</p>
<div style="width: 100%; text-align: left;"><x-import component-from-global-scope="QuietHeritage.TextField" label="Studio passcode" type="password" auto-complete="current-password"></x-import></div>
<div style="width: 100%;"><x-import component-from-global-scope="QuietHeritage.Button" block="{{yes}}" icon="lock">Open the dashboard</x-import></div>
<p style="margin: 0; font-size: 13px; color: #655E54;">Five wrong attempts lock the dashboard for 15 minutes.</p>
</form></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>

  renderVals() {
    return { yes: true, no: false, noop: () => {}, n16: 16, n20: 20, n24: 24, n28: 28, n32: 32, n36: 36, n40: 40, n48: 48, n56: 56, n64: 64 };
  }
}
</script>
